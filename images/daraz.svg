<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Daraz "D" hexagon logo -->
  <g transform="translate(10, 10)">
    <!-- Outer hexagon shape (orange) -->
    <polygon points="20,0 60,0 80,34.6 60,69.2 20,69.2 0,34.6" fill="#F85606"/>
    <!-- White triangle cutout (play arrow shape) -->
    <polygon points="22,17 22,52 52,34.6" fill="white"/>
    <!-- Inner orange triangle -->
    <polygon points="30,25 30,44 46,34.6" fill="#F85606"/>
  </g>
</svg>
