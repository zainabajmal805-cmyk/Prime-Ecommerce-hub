<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#f0f0f0"/>
  <!-- S - Blue -->
  <text x="8" y="62" font-family="Arial Black, Arial" font-weight="900" font-size="38" fill="#4285F4">S</text>
  <!-- E - Yellow -->
  <text x="33" y="62" font-family="Arial Black, Arial" font-weight="900" font-size="38" fill="#FBBC05">E</text>
  <!-- O circle outline - Red -->
  <circle cx="74" cy="45" r="16" fill="none" stroke="#EA4335" stroke-width="6"/>
  <!-- Green upward arrow inside O -->
  <polyline points="66,52 74,36 82,52" fill="none" stroke="#34A853" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Magnifier handle -->
  <line x1="85" y1="58" x2="93" y2="68" stroke="#5f6368" stroke-width="5" stroke-linecap="round"/>
</svg>
